# =============================================================================
# Humonex Bug issue form
# =============================================================================
# Dropped into each project repo at `.github/ISSUE_TEMPLATE/bug.yml`.
# QA-raised bugs use this. The "Type" Project field is set to "Bug" by the
# auto-add workflow; this template captures the human-side context.
# =============================================================================

name: Bug
description: Defect found in dev / UAT / prod
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What's broken?
      description: Short description of the bug.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment found in
      options:
        - dev
        - uat
        - production
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /profile
        2. Upload a 5MB JPG
        3. Page crashes
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, logs, console output, network traces. Drop in inline.
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
        - Urgent
      default: 2
    validations:
      required: true
